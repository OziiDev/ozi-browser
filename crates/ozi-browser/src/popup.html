<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<style>
  :root { --bar: #1d1e25; --fg: #eceef4; --muted: #8e91a1; --accent: #ff7a2f; --accent2: #ff4d8d; --border: #2b2c35; --hover: rgba(255,255,255,.07); --sel: rgba(255,122,47,.16); --ease: cubic-bezier(.2,.8,.2,1); }
  @media (prefers-color-scheme: light) { :root { --bar: #f6f7fb; --fg: #1b1c22; --muted: #686b7b; --border: #d3d6e0; --hover: rgba(0,0,0,.05); --sel: rgba(255,122,47,.16); } }
  * { box-sizing: border-box; margin: 0; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; background: var(--bar); color: var(--fg); font: 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { border: 1px solid var(--border); border-top: 0; border-radius: 0 0 14px 14px; padding: 4px; }
  #list { display: flex; flex-direction: column; gap: 1px; }
  .it { display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 10px; border-radius: 9px; cursor: default; animation: in .16s var(--ease) both;
    animation-delay: calc(var(--i) * 22ms); transition: background .12s; }
  .it:hover { background: var(--hover); }
  .it.sel { background: var(--sel); }
  @keyframes in { from { opacity: 0; transform: translateY(-5px); } }
  svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .it.sel svg { stroke: var(--accent); }
  .tx { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
  .ti { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 62%; }
  .ur { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 12px; flex: 1; min-width: 0; }
  .tag { font-size: 11px; color: var(--muted); flex: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
<body>
<div id="list"></div>
<script>
  var ICON = {
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.3-4.3"/></svg>',
    bookmark: '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.95 6 6.55.95-4.75 4.62 1.12 6.53L12 17.5l-5.87 3.1 1.12-6.53L2.5 9.45l6.55-.95L12 2.5z"/></svg>',
    history: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>'
  };
  var items = [], sel = -1;
  function post(o) { window.ipc.postMessage(JSON.stringify(o)); }
  function draw() {
    var box = document.getElementById('list');
    box.textContent = '';
    items.forEach(function (it, i) {
      var el = document.createElement('div');
      el.className = 'it' + (i === sel ? ' sel' : '');
      el.style.setProperty('--i', i);
      var tag = it.kind === 'search' ? 'Ara' : it.kind === 'bookmark' ? 'Yer imi' : '';
      el.innerHTML = ICON[it.kind] || ICON.history;
      var tx = document.createElement('div'); tx.className = 'tx';
      var ti = document.createElement('span'); ti.className = 'ti'; ti.textContent = it.title;
      tx.appendChild(ti);
      if (it.sub) { var ur = document.createElement('span'); ur.className = 'ur'; ur.textContent = it.sub; tx.appendChild(ur); }
      el.appendChild(tx);
      if (tag) { var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = tag; el.appendChild(tg); }
      // mousedown: odak değişimi (omnibox blur) tıklamayı yutmadan önce seç
      el.addEventListener('mousedown', function (e) { e.preventDefault(); post({ cmd: 'sug_pick', i: i }); });
      box.appendChild(el);
    });
  }
  window.oziPop = {
    set: function (list, s) { items = list; sel = s; draw(); },
    select: function (s) {
      sel = s;
      var els = document.querySelectorAll('.it');
      for (var i = 0; i < els.length; i++) els[i].classList.toggle('sel', i === s);
    }
  };
</script>
</html>
