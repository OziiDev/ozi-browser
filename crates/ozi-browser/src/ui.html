<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ozi UI</title>
<style>
  /* Firefox (Proton) tarzı: sekmeler çerçeve üzerinde yuvarlatılmış kutular, araç çubuğu ve adres çubuğu düz */
  :root {
    --frame: #f0f0f4; --toolbar: #f9f9fb; --tab-sel: #ffffff; --field: #f0f0f4; --field-hover: #e7e7ec;
    --fg: #15141a; --muted: #5b5b66; --border: rgba(0,0,0,.12); --hover: rgba(21,20,26,.08); --press: rgba(21,20,26,.14);
    --accent: #3b8eea; --shadow: 0 1px 4px rgba(58,57,68,.22); --ease: cubic-bezier(.2,.8,.2,1);
  }
  :root[data-theme="dark"] {
    --frame: #1c1b22; --toolbar: #2b2a33; --tab-sel: #42414d; --field: #1c1b22; --field-hover: #3a3944;
    --fg: #fbfbfe; --muted: #bfbfc9; --border: rgba(255,255,255,.12); --hover: rgba(251,251,254,.1); --press: rgba(251,251,254,.16);
    --shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  /* Gizli sekme: Firefox gibi mor çerçeve */
  :root[data-private] {
    --frame: #25003e; --toolbar: #3a1a63; --tab-sel: #52307f; --field: #25003e; --field-hover: #331255;
    --fg: #fbfbfe; --muted: #d4c8ee; --border: rgba(255,255,255,.14); --hover: rgba(251,251,254,.12); --press: rgba(251,251,254,.2);
    --accent: #c19bff;
  }
  * { box-sizing: border-box; margin: 0; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; background: var(--frame); color: var(--fg);
    font: 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; transition: background-color .25s; }
  svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- sekmeler ---------- */
  #tabs { display: flex; align-items: center; height: 38px; padding: 4px 8px 4px; gap: 3px; }
  .tab { position: relative; display: flex; align-items: center; gap: 8px; min-width: 40px; flex: 0 1 225px; height: 30px;
    padding: 0 4px 0 10px; border-radius: 7px; color: var(--muted); cursor: default; overflow: hidden;
    transition: background-color .15s, color .15s, box-shadow .2s; }
  .tab:hover { background: var(--hover); color: var(--fg); }
  .tab.active { background: var(--tab-sel); color: var(--fg); box-shadow: var(--shadow); }
  .tab.active::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 2px 2px 0 0;
    background: var(--accent); animation: grow .3s var(--ease); transform-origin: center; }
  .tab.entering { animation: tabIn .28s var(--ease); }
  .tab.leaving { animation: tabOut .2s var(--ease) forwards; pointer-events: none; }
  @keyframes tabIn { from { flex-basis: 0; opacity: 0; transform: scale(.9); } }
  @keyframes tabOut { to { flex-basis: 0; min-width: 0; opacity: 0; padding: 0; gap: 0; transform: scale(.85); } }
  @keyframes grow { from { transform: scaleX(0); } }
  .fav { position: relative; width: 16px; height: 16px; flex: none; border-radius: 4px; overflow: hidden; display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: #fff; }
  .fav img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--tab-sel); }
  .tab:not(.active) .fav img { background: var(--frame); }
  .fav .sp { position: absolute; inset: 0; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-top-color: var(--accent); animation: spin .7s linear infinite; display: none; background: var(--tab-sel); }
  .tab:not(.active) .fav .sp { background: var(--frame); }
  .tab.loading .fav .sp { display: block; }
  .tab.private .fav { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tab .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
  .tab .x { width: 22px; height: 22px; border-radius: 5px; border: 0; background: none; color: inherit; cursor: pointer; display: grid; place-items: center;
    opacity: 0; transition: opacity .15s, background-color .15s; flex: none; }
  .tab:hover .x, .tab.active .x { opacity: .85; }
  .tab .x:hover { background: var(--press); opacity: 1; }
  .tab .x svg { width: 13px; height: 13px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #newtab { margin-left: 2px; width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--fg); cursor: pointer;
    display: grid; place-items: center; transition: background-color .15s, transform .25s var(--ease); flex: none; }
  #newtab:hover { background: var(--hover); transform: rotate(90deg); }

  /* ---------- araç çubuğu ---------- */
  #bar { position: relative; display: flex; align-items: center; gap: 2px; height: 48px; padding: 0 8px; background: var(--toolbar);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); transition: background-color .25s; }
  .nb { position: relative; width: 32px; height: 32px; border: 0; border-radius: 6px; background: none; color: var(--fg); cursor: pointer; flex: none;
    display: grid; place-items: center; transition: background-color .15s, transform .12s var(--ease), opacity .15s; }
  .nb:hover { background: var(--hover); }
  .nb:active { background: var(--press); transform: scale(.92); }
  .nb:disabled { opacity: .35; pointer-events: none; }
  .nb img { width: 18px; height: 18px; object-fit: contain; }
  .nb.spinning svg { animation: spin .45s var(--ease); }
  #star { width: 28px; height: 28px; margin-right: -6px; }
  #star.on { color: var(--accent); }
  #star.on svg { fill: currentColor; }
  #star.pop svg { animation: pop .42s var(--ease); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.45) rotate(-12deg); } 100% { transform: scale(1); } }
  #omniwrap { position: relative; flex: 1; min-width: 80px; height: 34px; margin: 0 6px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 10px;
    border-radius: 8px; background: var(--field); border: 1px solid transparent;
    transition: border-color .15s, box-shadow .18s, background-color .15s; }
  #omniwrap:hover { background: var(--field-hover); }
  #omniwrap:focus-within { background: var(--field); border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
  #sec { color: var(--muted); display: grid; place-items: center; transition: color .2s; }
  #sec svg { width: 15px; height: 15px; }
  #sec.ok { color: #3fb27f; }
  #sec.bad { color: #e0a34a; }
  #omni { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: none; background: none; color: var(--fg); font-size: 14px;
    user-select: text; -webkit-user-select: text; }
  #omni::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
  #chip { flex: none; font-size: 11px; color: var(--muted); padding: 3px 9px; border-radius: 6px; background: var(--hover);
    opacity: 0; transform: translateX(6px); transition: opacity .18s, transform .18s var(--ease); pointer-events: none; white-space: nowrap; }
  #chip.show { opacity: 1; transform: none; }
  #exts { display: flex; gap: 2px; }
  #progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; opacity: 0; transition: opacity .25s; pointer-events: none; overflow: hidden; }
  #progress.on { opacity: 1; }
  #progress i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); transition: width .3s var(--ease); }
  #progress i::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 80px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.7)); animation: shimmer 1s linear infinite; }
  @keyframes shimmer { from { transform: translateX(-100%); opacity: 0; } 30% { opacity: 1; } to { transform: translateX(0); opacity: 0; } }

  /* ---------- sayfada ara ---------- */
  #find { display: none; align-items: center; gap: 6px; height: 40px; padding: 0 12px; background: var(--toolbar); border-bottom: 1px solid var(--border); }
  #find.open { display: flex; animation: drop .22s var(--ease); }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px); } }
  #fq { width: 260px; height: 28px; padding: 0 12px; border: 1px solid transparent; border-radius: 7px; outline: none; background: var(--field);
    color: var(--fg); font-size: 13px; user-select: text; -webkit-user-select: text; transition: border-color .15s, box-shadow .18s; }
  #fq:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
  #find .nb { width: 28px; height: 28px; }
  #find .nb svg { width: 16px; height: 16px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.95 6 6.55.95-4.75 4.62 1.12 6.53L12 17.5l-5.87 3.1 1.12-6.53L2.5 9.45l6.55-.95L12 2.5z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.3-4.3"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  </svg>

  <div id="tabs"></div>
  <div id="bar">
    <button class="nb" id="back" title="Geri (Alt+←)" disabled><svg class="ic"><use href="#i-back"/></svg></button>
    <button class="nb" id="fwd" title="İleri (Alt+→)" disabled><svg class="ic"><use href="#i-fwd"/></svg></button>
    <button class="nb" id="reload" title="Yenile (Ctrl+R)"><svg class="ic"><use href="#i-reload"/></svg></button>
    <div id="omniwrap">
      <span id="sec"><svg class="ic"><use href="#i-search"/></svg></span>
      <input id="omni" type="text" spellcheck="false" autocomplete="off" placeholder="Ara ya da adres yaz">
      <span id="chip"></span>
      <button class="nb" id="star" title="Yer imi ekle (Ctrl+D)"><svg class="ic"><use href="#i-star"/></svg></button>
    </div>
    <div id="exts"></div>
    <button class="nb" id="menu" title="Menüyü aç"><svg class="ic"><use href="#i-menu"/></svg></button>
    <div id="progress"><i></i></div>
  </div>
  <div id="find">
    <input id="fq" type="text" spellcheck="false" placeholder="Sayfada ara…">
    <button class="nb" id="fprev" title="Önceki (Shift+Enter)"><svg class="ic"><use href="#i-up"/></svg></button>
    <button class="nb" id="fnext" title="Sonraki (Enter)"><svg class="ic"><use href="#i-down"/></svg></button>
    <button class="nb" id="fclose" title="Kapat (Esc)"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
<script>
  var S = { tabs: [], active: 0, exts: [], engines: [], bookmarked: false, find: false, back: false, fwd: false, theme: 'system', accent: 'blue' };
  var $ = function (id) { return document.getElementById(id); };
  var tabEls = {};
  var wasBookmarked = false;
  var extSig = '';
  var progHide = null;
  var dark = window.matchMedia('(prefers-color-scheme: dark)');
  function post(o) { window.ipc.postMessage(JSON.stringify(o)); }
  function go(u) { post({ cmd: 'go', input: u }); }
  function icon(id) { return '<svg class="ic"><use href="#' + id + '"/></svg>'; }

  function applyTheme() {
    var root = document.documentElement;
    var eff = S.theme === 'system' ? (dark.matches ? 'dark' : 'light') : S.theme;
    root.setAttribute('data-theme', eff);
    if (S.accentHex) root.style.setProperty('--accent', S.accentHex);
    var cur = S.tabs.filter(function (t) { return t.id === S.active; })[0];
    if (cur && cur.private) root.setAttribute('data-private', ''); else root.removeAttribute('data-private');
  }
  if (dark.addEventListener) dark.addEventListener('change', applyTheme);
  applyTheme();

  function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }

  function makeTab() {
    var el = document.createElement('div');
    el.className = 'tab entering';
    el.innerHTML = '<span class="fav"><b></b><span class="sp"></span></span><span class="t"></span><button class="x" title="Sekmeyi kapat">' + icon('i-x') + '</button>';
    el.onclick = function () { post({ cmd: 'switch', id: el._id }); };
    el.onauxclick = function (e) { if (e.button === 1) post({ cmd: 'close_tab', id: el._id }); };
    el.querySelector('.x').onclick = function (e) { e.stopPropagation(); post({ cmd: 'close_tab', id: el._id }); };
    el.addEventListener('animationend', function (e) { if (e.animationName === 'tabIn') el.classList.remove('entering'); });
    return el;
  }

  function updateTab(el, t) {
    el._id = t.id;
    el.classList.toggle('active', t.id === S.active);
    el.classList.toggle('private', !!t.private);
    el.classList.toggle('loading', !!t.loading);
    var internal = t.url.indexOf('ozi://') === 0;
    var host = internal ? '' : hostOf(t.url);
    var label = t.title || (t.url === 'ozi://newtab' ? 'Yeni sekme' : (host || t.url)) || 'Yeni sekme';
    var tt = el.querySelector('.t');
    if (tt.textContent !== label) tt.textContent = label;
    el.title = label;
    var fav = el.querySelector('.fav');
    var key = internal ? 'ozi' : host;
    if (el._host !== key) {
      el._host = key;
      var old = fav.querySelector('img'); if (old) old.remove();
      fav.style.background = key === 'ozi' || !key ? 'linear-gradient(135deg,#ff7a2f,#ff4d8d)' : 'hsl(' + hue(key) + ',55%,48%)';
      fav.querySelector('b').textContent = key === 'ozi' || !key ? 'O' : key[0].toUpperCase();
      if (t.favicon && key && key !== 'ozi') {
        var img = new Image();
        img.onload = function () { if (img.naturalWidth > 1 && el._host === key) { fav.appendChild(img); } };
        img.src = new URL(t.url).origin + '/favicon.ico';
      }
    }
  }

  function syncTabs() {
    var box = $('tabs');
    var alive = {};
    S.tabs.forEach(function (t) { alive[t.id] = true; });
    Object.keys(tabEls).forEach(function (id) {
      if (!alive[id]) {
        var el = tabEls[id]; delete tabEls[id];
        el.classList.remove('entering'); el.classList.add('leaving');
        setTimeout(function () { el.remove(); }, 260);
      }
    });
    var nt = $('newtab');
    if (!nt) {
      nt = document.createElement('button');
      nt.id = 'newtab'; nt.title = 'Yeni sekme (Ctrl+T)'; nt.innerHTML = icon('i-plus');
      nt.onclick = function () { post({ cmd: 'new_tab' }); };
      box.appendChild(nt);
    }
    S.tabs.forEach(function (t) {
      var el = tabEls[t.id];
      if (!el) { el = makeTab(); tabEls[t.id] = el; box.insertBefore(el, nt); }
      updateTab(el, t);
    });
    var ref = nt;
    for (var i = S.tabs.length - 1; i >= 0; i--) {
      var e2 = tabEls[S.tabs[i].id];
      if (e2.nextSibling !== ref) box.insertBefore(e2, ref);
      ref = e2;
    }
  }

  function looksLikeUrl(v) {
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) return true;
    return !/\s/.test(v) && (/^localhost(:\d+)?(\/|$)/.test(v) || /^[^\s.]+(\.[^\s.]+)+(:\d+)?([\/?#].*)?$/.test(v));
  }

  function updateChip() {
    var v = $('omni').value.trim(), chip = $('chip');
    if (!v || document.activeElement !== $('omni')) { chip.classList.remove('show'); return; }
    var text;
    var m = /^(\S+)\s+\S/.exec(v), eng = null;
    if (m) S.engines.forEach(function (e) { if (e.keyword.toLowerCase() === m[1].toLowerCase()) eng = e; });
    if (eng) text = eng.name + ' ile ara ↵';
    else if (looksLikeUrl(v)) text = 'Git ↵';
    else { var d = S.engines.filter(function (e) { return e.default; })[0]; text = (d ? d.name : 'Ara') + ' ile ara ↵'; }
    chip.textContent = text; chip.classList.add('show');
  }

  function updateSecurity(url) {
    var sec = $('sec'), ico = 'i-search', cls = '';
    if (url.indexOf('https://') === 0) { ico = 'i-lock'; cls = 'ok'; }
    else if (url.indexOf('http://') === 0) { ico = 'i-unlock'; cls = 'bad'; }
    if (sec._ico !== ico) { sec._ico = ico; sec.innerHTML = icon(ico); }
    sec.className = cls;
  }

  // Gerçek yükleme ilerlemesi (WebKit estimated-load-progress)
  function updateProgress(cur) {
    var p = $('progress'), bar = p.firstElementChild;
    if (cur && cur.loading) {
      if (progHide) { clearTimeout(progHide); progHide = null; }
      if (!p.classList.contains('on')) { bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth; bar.style.transition = ''; }
      p.classList.add('on');
      bar.style.width = Math.max(8, Math.min(95, (cur.progress || 0) * 100)) + '%';
    } else if (p.classList.contains('on') && !progHide) {
      bar.style.width = '100%';
      progHide = setTimeout(function () { p.classList.remove('on'); progHide = null; }, 220);
    }
  }

  function render() {
    syncTabs();
    applyTheme();
    var cur = S.tabs.filter(function (t) { return t.id === S.active; })[0];
    if (cur) {
      if (document.activeElement !== $('omni')) {
        var v = cur.url === 'ozi://newtab' ? '' : cur.url;
        if ($('omni').value !== v) $('omni').value = v;
      }
      updateSecurity(cur.url);
      updateProgress(cur);
      var rl = $('reload');
      var wantStop = !!cur.loading;
      if (rl._stop !== wantStop) {
        rl._stop = wantStop;
        rl.innerHTML = icon(wantStop ? 'i-x' : 'i-reload');
        rl.title = wantStop ? 'Durdur' : 'Yenile (Ctrl+R)';
      }
    }
    $('back').disabled = !S.back;
    $('fwd').disabled = !S.fwd;
    var st = $('star');
    st.classList.toggle('on', !!S.bookmarked);
    if (S.bookmarked && !wasBookmarked) { st.classList.add('pop'); setTimeout(function () { st.classList.remove('pop'); }, 450); }
    wasBookmarked = S.bookmarked;
    $('find').className = S.find ? 'open' : '';
    // Uzantı düğmeleri yalnızca değiştiyse yeniden çizilir (titremesin)
    var sig = JSON.stringify(S.exts);
    if (sig !== extSig) {
      extSig = sig;
      var ex = $('exts');
      ex.textContent = '';
      S.exts.forEach(function (e) {
        var b = document.createElement('button');
        b.className = 'nb'; b.title = e.name;
        if (e.icon) { var i = document.createElement('img'); i.src = e.icon; i.onerror = function () { b.textContent = e.name[0] || '?'; i.remove(); }; b.appendChild(i); }
        else b.textContent = (e.name || '?')[0];
        b.onclick = function () { post({ cmd: 'ext_click', id: e.id }); };
        ex.appendChild(b);
      });
    }
  }

  window.oziUi = {
    state: function (s) { var open = S.find; S = s; render(); if (S.find && !open) { $('fq').focus(); $('fq').select(); } },
    focusOmni: function () { $('omni').focus(); $('omni').select(); },
    blurOmni: function () { $('omni').blur(); },
    // Öneri listesinde ok tuşlarıyla gezinirken adres çubuğunu seçili öğeyle doldur
    fill: function (text) { var o = $('omni'); o.value = text; try { o.setSelectionRange(text.length, text.length); } catch (e) {} updateChip(); },
    // Satır içi tamamlama
    suggest: function (q, list) {
      var o = $('omni');
      if (o.value !== q || document.activeElement !== o) return;
      for (var i = 0; i < list.length; i++) {
        var u = list[i].url;
        if (!/^https:\/\/|^http:\/\/localhost/.test(u)) continue;
        var d = u.replace(/^https?:\/\//, '').replace(/^www\./, '');
        if (d.length > q.length && d.toLowerCase().indexOf(q.toLowerCase()) === 0) {
          o.value = q + d.slice(q.length);
          o.setSelectionRange(q.length, o.value.length);
          break;
        }
      }
      updateChip();
    }
  };

  $('omni').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { go(this.value); this.blur(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); post({ cmd: 'sug_move', d: e.key === 'ArrowDown' ? 1 : -1 }); }
    else if (e.key === 'Escape') { post({ cmd: 'sug_hide' }); this.blur(); render(); }
  });
  $('omni').addEventListener('input', function (e) {
    updateChip();
    var q = this.value;
    var deleting = e.inputType && e.inputType.indexOf('delete') === 0;
    var r = $('omniwrap').getBoundingClientRect();
    if (!q.trim()) post({ cmd: 'sug_hide' });
    else post({ cmd: 'suggest', q: q, x: r.left, y: r.bottom + 5, w: r.width, inline: !deleting && !/\s/.test(q) });
  });
  $('omni').addEventListener('focus', function () { this.select(); updateChip(); });
  $('omni').addEventListener('blur', function () {
    $('chip').classList.remove('show');
    // Liste satırı mousedown ile seçilir; blur'dan sonra kapatmak için kısa gecikme
    setTimeout(function () { if (document.activeElement !== $('omni')) post({ cmd: 'sug_hide' }); }, 180);
  });
  $('back').onclick = function () { post({ cmd: 'back' }); };
  $('fwd').onclick = function () { post({ cmd: 'forward' }); };
  $('reload').onclick = function (e) {
    var b = this;
    if (b._stop) { post({ cmd: 'stop' }); return; }
    b.classList.remove('spinning'); void b.offsetWidth; b.classList.add('spinning');
    post({ cmd: e.shiftKey ? 'hard_reload' : 'reload' });
  };
  $('star').onclick = function () { post({ cmd: 'bookmark' }); };
  $('menu').onclick = function () {
    var r = this.getBoundingClientRect();
    post({ cmd: 'menu', x: r.right, y: r.bottom + 4 });
  };

  $('fq').addEventListener('input', function () { post({ cmd: 'find', q: this.value, back: false, fresh: true }); });
  $('fq').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') post({ cmd: 'find', q: this.value, back: e.shiftKey });
    else if (e.key === 'Escape') post({ cmd: 'find_toggle' });
  });
  $('fnext').onclick = function () { post({ cmd: 'find', q: $('fq').value, back: false }); };
  $('fprev').onclick = function () { post({ cmd: 'find', q: $('fq').value, back: true }); };
  $('fclose').onclick = function () { post({ cmd: 'find_toggle' }); };

  // Yedek kısayollar (Linux'ta Rust pencere düzeyinde de yakalar).
  document.addEventListener('keydown', function (e) {
    var c = e.ctrlKey || e.metaKey;
    var k = e.key.toLowerCase();
    if (c && e.shiftKey && k === 'n') { e.preventDefault(); post({ cmd: 'private_tab' }); }
    else if (c && k === 't') { e.preventDefault(); post({ cmd: 'new_tab' }); }
    else if (c && k === 'w') { e.preventDefault(); post({ cmd: 'close_tab', id: S.active }); }
    else if (c && k === 'l') { e.preventDefault(); window.oziUi.focusOmni(); }
    else if (c && k === 'd') { e.preventDefault(); post({ cmd: 'bookmark' }); }
    else if (c && k === 'f') { e.preventDefault(); post({ cmd: 'find_toggle' }); }
    else if (c && k === 'h') { e.preventDefault(); go('ozi://history'); }
    else if (c && k === 'j') { e.preventDefault(); go('ozi://downloads'); }
    else if ((c && k === 'r') || e.key === 'F5') { e.preventDefault(); post({ cmd: 'reload' }); }
    else if (e.altKey && e.key === 'ArrowLeft') post({ cmd: 'back' });
    else if (e.altKey && e.key === 'ArrowRight') post({ cmd: 'forward' });
  });
  syncTabs();
  post({ cmd: 'ready' });
</script>
</html>
